<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Sparks</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="surface">
      <header class="app-header">
        <div>
          <p class="eyebrow">Experience 03</p>
          <h1>Neon Sparks</h1>
          <p class="description">Tap any tile to spark a quick neon animation.</p>
        </div>
      </header>

      <main>
        <section class="card" style="padding: 24px;">
          <div class="card-label">Spark</div>
          <div id="tileContainer" style="display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));">
            <button class="theme-button" style="padding:26px;border-radius:24px;">Tile 1</button>
            <button class="theme-button" style="padding:26px;border-radius:24px;">Tile 2</button>
            <button class="theme-button" style="padding:26px;border-radius:24px;">Tile 3</button>
            <button class="theme-button" style="padding:26px;border-radius:24px;">Tile 4</button>
          </div>
          <p class="small-note" id="tileNote">Tap a tile to see a neon flash.</p>
        </section>

        <a class="card" href="../index.html" style="text-align:center;">Back to directory</a>
      </main>
    </div>

    <script>
      const tileButtons = document.querySelectorAll('#tileContainer button');
      const tileNote = document.getElementById('tileNote');

      tileButtons.forEach((button, index) => {
        button.addEventListener('click', () => {
          const original = button.style.boxShadow;
          button.style.boxShadow = '0 0 0 0 rgba(255, 91, 128, 0.6)';
          button.animate([
            { boxShadow: '0 0 0 0 rgba(255, 91, 128, 0.6)' },
            { boxShadow: '0 0 28px 10px rgba(255, 91, 128, 0.35)' },
            { boxShadow: '0 0 0 0 rgba(255, 91, 128, 0)' }
          ], {
            duration: 420,
            easing: 'ease-out'
          });
          tileNote.textContent = `Neon spark ${index + 1} ignited.`;
          setTimeout(() => {
            tileNote.textContent = 'Tap any tile again for another spark.';
          }, 1200);
        });
      });
    </script>
  </body>
</html>
